name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "22"

jobs:
  # ── Desktop builds ──────────────────────────────────────────────
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            label: Linux ARM64

          - os: macos-13
            target: x86_64-apple-darwin
            label: macOS x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS ARM64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: Windows ARM64

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.label, 'ARM64') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js via fnm
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # fnm on Windows
            choco install fnm -y
            echo "FNM_DIR=$HOME/.fnm" >> $GITHUB_ENV
            echo "$HOME/.fnm" >> $GITHUB_PATH
          else
            curl -fsSL https://fnm.vercel.app/install | bash
            echo "$HOME/.local/share/fnm" >> $GITHUB_PATH
            echo "$HOME/.local/share/fnm/aliases/default/bin" >> $GITHUB_PATH
          fi
          echo "FNM_COREPACK_ENABLED=true" >> $GITHUB_ENV

      - name: Install Node ${{ env.NODE_VERSION }}
        shell: bash
        run: |
          eval "$(fnm env)"
          fnm install ${{ env.NODE_VERSION }}
          fnm use ${{ env.NODE_VERSION }}
          echo "node-version=$(node -v)" >> $GITHUB_OUTPUT
        id: node

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          echo "pnpm-version=$(pnpm -v)" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Linux ARM64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -yqq \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 \
            libsoup-3.0-dev:arm64 libjavascriptcoregtk-4.1-dev:arm64 \
            librsvg2-dev:arm64

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk+3 adwaita-icon-theme

      - name: Install JS dependencies
        shell: bash
        run: |
          eval "$(fnm env)"
          pnpm approve-builds vue-demi
          pnpm install --frozen-lockfile

      - name: Build with Tauri
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          eval "$(fnm env)"
          pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  # ── Android build ───────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js via fnm
        shell: bash
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash
          echo "$HOME/.local/share/fnm" >> $GITHUB_PATH
          echo "$HOME/.local/share/fnm/aliases/default/bin" >> $GITHUB_PATH
          echo "FNM_COREPACK_ENABLED=true" >> $GITHUB_ENV

      - name: Install Node ${{ env.NODE_VERSION }}
        shell: bash
        run: |
          eval "$(fnm env)"
          fnm install ${{ env.NODE_VERSION }}
          fnm use ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        shell: bash
        run: |
          eval "$(fnm env)"
          pnpm approve-builds vue-demi
          pnpm install --frozen-lockfile

      - name: Build Android APK
        shell: bash
        run: |
          eval "$(fnm env)"
          pnpm tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: src-tauri/gen/android/app/build/outputs/apk/**

  # ── iOS build ───────────────────────────────────────────────────
  ios:
    name: iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js via fnm
        shell: bash
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash
          echo "$HOME/.local/share/fnm" >> $GITHUB_PATH
          echo "$HOME/.local/share/fnm/aliases/default/bin" >> $GITHUB_PATH
          echo "FNM_COREPACK_ENABLED=true" >> $GITHUB_ENV

      - name: Install Node ${{ env.NODE_VERSION }}
        shell: bash
        run: |
          eval "$(fnm env)"
          fnm install ${{ env.NODE_VERSION }}
          fnm use ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        shell: bash
        run: |
          eval "$(fnm env)"
          pnpm approve-builds vue-demi
          pnpm install --frozen-lockfile

      - name: Build iOS
        shell: bash
        run: |
          eval "$(fnm env)"
          pnpm tauri ios build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: src-tauri/gen/ios/build/

  # ── Release (only on tag push) ──────────────────────────────────
  release:
    name: Upload to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts -type f | while read f; do
            dir=$(basename "$(dirname "$f")")
            ext="${f##*.}"
            if [ "$ext" = "deb" ] || [ "$ext" = "rpm" ] || [ "$ext" = "AppImage" ]; then
              cp "$f" "release/${dir}.${ext}"
            elif [ "$ext" = "dmg" ]; then
              cp "$f" "release/${dir}.dmg"
            elif [ "$ext" = "msi" ] || [ "$ext" = "exe" ] || [ "$ext" = "nupkg" ]; then
              cp "$f" "release/${dir}.${ext}"
            elif [ "$ext" = "apk" ]; then
              cp "$f" "release/ns-download-${dir}.apk"
            elif [ "$ext" = "ipa" ]; then
              cp "$f" "release/ns-download-${dir}.ipa"
            fi
          done
          ls -la release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
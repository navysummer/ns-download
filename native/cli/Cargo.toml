[package]
name = "ns_download_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nsdownload"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
ns_download_api = { version = "0.1.0", path = "../api" }
ns_download_engine = { version = "0.1.0", path = "../engine" }
reqwest = { version = "0.12", default-features = false, features = ["json", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "1.1.2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "rustls-tls-native-roots"] }

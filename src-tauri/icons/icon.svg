<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 更亮更纯的朱红背景 -->
    <linearGradient id="sealBg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E05A45"/>
      <stop offset="45%" stop-color="#D64531"/>
      <stop offset="100%" stop-color="#B5331F"/>
    </linearGradient>
    <!-- 明亮的镏金色 -->
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D463"/>
      <stop offset="50%" stop-color="#E8BE3A"/>
      <stop offset="100%" stop-color="#CBA31F"/>
    </linearGradient>
    <linearGradient id="innerRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C847"/>
      <stop offset="100%" stop-color="#C89A1E"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <rect x="14" y="18" width="996" height="996" rx="228" fill="#000" opacity="0.22"/>

  <!-- 明亮朱红背景 -->
  <rect width="1024" height="1024" rx="228" fill="url(#sealBg)"/>

  <!-- 外圈金色描边 -->
  <rect x="20" y="20" width="984" height="984" rx="216" fill="none" stroke="url(#goldText)" stroke-width="7"/>

  <!-- 内圈金色细环 -->
  <rect x="52" y="52" width="920" height="920" rx="190" fill="none" stroke="url(#innerRing)" stroke-width="3" opacity="0.7"/>

  <!-- 顶部：云字（古代云纹） -->
  <g fill="none" stroke="url(#goldText)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- 云字上部的横 -->
    <line x1="300" y1="210" x2="724" y2="210"/>
    <line x1="336" y1="282" x2="688" y2="282"/>
    <!-- 云字竖 -->
    <line x1="336" y1="282" x2="336" y2="420"/>
    <line x1="688" y1="282" x2="688" y2="420"/>
    <line x1="300" y1="420" x2="724" y2="420"/>
    <!-- 云字下部的云卷 -->
    <path d="M300 452 L512 700 L724 452"/>
    <path d="M352 452 Q512 640 672 452"/>
  </g>

  <!-- 底部：下载箭头（体现下载软件的船/下载意象） -->
  <g fill="none" stroke="url(#goldText)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <line x1="512" y1="700" x2="512" y2="812"/>
    <polyline points="452,772 512,812 572,772"/>
  </g>

  <!-- 四角装饰点 -->
  <circle cx="170" cy="170" r="14" fill="url(#goldText)"/>
  <circle cx="854" cy="170" r="14" fill="url(#goldText)"/>
  <circle cx="170" cy="854" r="14" fill="url(#goldText)"/>
  <circle cx="854" cy="854" r="14" fill="url(#goldText)"/>
</svg>